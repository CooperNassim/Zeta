<!DOCTYPE html>
<html>
<head>
    <title>数据流程调试器</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>数据流程测试工具</h1>
    <div>
        <button onclick="testITickAPI()">测试 iTick API</button>
        <button onclick="testStoreData()">测试数据存储</button>
        <button onclick="testMarketData()">测试行情中心数据获取</button>
        <button onclick="testFullFlow()">测试完整流程</button>
    </div>
    <div id="output" style="margin-top: 20px; white-space: pre-wrap; font-family: monospace;"></div>

    <script type="module">
        const output = document.getElementById('output');
        
        async function importModule(path) {
            try {
                const module = await import(path);
                return module.default || module;
            } catch (error) {
                log(`❌ 导入模块失败: ${path} - ${error.message}`);
                return null;
            }
        }
        
        function log(message) {
            output.textContent += message + '\n';
            console.log(message);
        }
        
        async function testITickAPI() {
            log('🧪 测试 iTick API...');
            const itickApi = await importModule('./src/services/itickApi.js');
            if (!itickApi) return;
            
            try {
                const symbol = '000001';
                log(`下载股票 ${symbol} 数据...`);
                
                const result = await itickApi.getStockQuote(symbol);
                if (result) {
                    log('✅ iTick API 测试成功');
                    log(`股票代码: ${result.code || symbol}`);
                    log(`当前价格: ${result.current}`);
                    log(`涨跌幅: ${result.pct_chg}%`);
                    
                    // 检查存储是否触发
                    log('存储状态: API配置中 SAVE_TO_DB=' + (result.SAVE_TO_DB !== undefined ? result.SAVE_TO_DB : '使用默认配置'));
                } else {
                    log('❌ iTick API 返回空数据');
                }
            } catch (error) {
                log('❌ iTick API 测试失败: ' + error.message);
            }
        }
        
        async function testStoreData() {
            log('💾 测试数据存储服务...');
            const storageService = await importModule('./src/services/dataStorageService.js');
            if (!storageService) return;
            
            try {
                // 创建测试数据
                const testData = {
                    code: '000001',
                    current: 15.23,
                    last_close: 15.00,
                    pct_chg: 1.53,
                    name: '平安银行'
                };
                
                log('尝试存储测试数据...');
                await storageService.storeStockData(testData, 'itick');
                log('✅ 数据存储逻辑执行成功（不报错即表示存储逻辑正常）');
                
            } catch (error) {
                log('❌ 数据存储服务测试失败: ' + error.message);
            }
        }
        
        async function testMarketData() {
            log('📊 测试行情中心数据获取...');
            
            try {
                const module = await import('./src/services/marketDataService.js');
                const MarketDataService = module.default;
                const service = new MarketDataService();
                
                log('从数据库获取实时行情数据...');
                const stocks = await service.getRealtimeQuotes(['000001']);
                
                if (stocks && stocks.length > 0) {
                    log(`✅ 行情中心获取到 ${stocks.length} 只股票数据`);
                    stocks.slice(0, 3).forEach(stock => {
                        log(`   ${stock.symbol} - ${stock.currentPrice} (${stock.changePercent}%)`);
                    });
                } else {
                    log('⚠️ 数据库中没有查询到数据，将尝试使用实时API');
                }
                
            } catch (error) {
                log('❌ 行情中心数据获取测试失败: ' + error.message);
            }
        }
        
        async function testFullFlow() {
            log('🚀 测试完整数据流程...');
            
            // 1. 测试 iTick API
            const itickApi = await importModule('./src/services/itickApi.js');
            if (!itickApi) return;
            
            const symbol = '000001';
            log(`1. 下载股票 ${symbol} 数据...`);
            
            const stockData = await itickApi.getStockQuote(symbol);
            if (!stockData) {
                log('❌ iTick API 下载失败，流程中止');
                return;
            }
            
            log('✅ 数据下载成功');
            
            // 2. 检查存储日志（需要监听控制台）
            log('2. 请查看浏览器控制台是否有存储成功日志...');
            
            // 3. 测试行情中心获取
            setTimeout(async () => {
                try {
                    log('3. 等待2秒后测试行情中心数据获取...');
                    
                    const module = await import('./src/services/marketDataService.js');
                    const MarketDataService = module.default;
                    const service = new MarketDataService();
                    
                    const stocks = await service.getRealtimeQuotes([symbol]);
                    
                    if (stocks && stocks.length > 0) {
                        log('✅ 完整流程成功！数据已从下载→存储→成功被行情中心获取');
                        stocks.forEach(stock => {
                            log(`   股票 ${stock.symbol}: ${stock.currentPrice} (数据源: ${stock.dataSource})`);
                        });
                    } else {
                        log('⚠️ 数据下载成功，但行情中心未获取到数据');
                        log('可能原因：');
                        log('   - 数据存储失败');
                        log('   - 数据库连接问题');
                        log('   - 存储和读取的时间差');
                    }
                    
                } catch (error) {
                    log('❌ 流程测试失败: ' + error.message);
                }
            }, 2000);
        }
    </script>
</body>
</html>
