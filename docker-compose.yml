services:
  postgres:
    image: postgres:16-alpine
    container_name: zeta-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme_secure_password}
      - POSTGRES_DB=zeta_trading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zeta-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zeta-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=zeta_trading
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-changeme_secure_password}
      - CORS_ORIGIN=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_secure_random_string}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - zeta-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeta-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - zeta-network

volumes:
  postgres_data:

networks:
  zeta-network:
    driver: bridge
